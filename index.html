                                    <button onClick={() => setView('home')} className="hover:text-brand-orange font-medium">Trang chủ</button>
                                    <i className="fa-solid fa-chevron-right text-[10px] text-slate-400"></i>
                                    <span>{currentProduct.categoryName}</span>
                                    <i className="fa-solid fa-chevron-right text-[10px] text-slate-400"></i>
                                    <span className="text-slate-800 font-semibold truncate">{currentProduct.name}</span>
                                </nav>

                                {/* Top Gallery & Core Info */}
                                <div className="bg-white rounded-2xl border border-slate-200 p-6 md:p-8 smooth-shadow grid grid-cols-1 lg:grid-cols-12 gap-8 mb-8">
                                    
                                    {/* Left: Product Gallery */}
                                    <div className="lg:col-span-5 flex flex-col gap-4">
                                        <div className="aspect-square bg-slate-100 rounded-xl overflow-hidden border border-slate-200 relative">
                                            <img 
                                                src={currentProduct.gallery[activeImage] || currentProduct.image} 
                                                alt={currentProduct.name} 
                                                className="w-full h-full object-cover" 
                                            />
                                            <span className="absolute top-3 left-3 bg-emerald-500 text-white text-[11px] font-bold px-2.5 py-1 rounded-md">
                                                <i className="fa-solid fa-check-circle mr-1"></i>Chính Hãng
                                            </span>
                                        </div>
                                        {currentProduct.gallery.length > 1 && (
                                            <div className="flex gap-3">
                                                {currentProduct.gallery.map((img, idx) => (
                                                    <button 
                                                        key={idx} 
                                                        onClick={() => setActiveImage(idx)}
                                                        className={`w-20 h-20 rounded-lg overflow-hidden border-2 transition ${activeImage === idx ? 'border-brand-orange shadow' : 'border-slate-200 opacity-70 hover:opacity-100'}`}
                                                    >
                                                        <img src={img} className="w-full h-full object-cover" />
                                                    </button>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    {/* Right: Info & Pricing CTA */}
                                    <div className="lg:col-span-7 flex flex-col justify-between">
                                        <div>
                                            <div className="flex items-center gap-3 mb-2">
                                                <span className="bg-navy-900 text-white text-xs font-bold px-2.5 py-1 rounded">Mã SP: {currentProduct.id}</span>
                                                <span className="text-xs text-emerald-600 font-semibold flex items-center gap-1">
                                                    <i className="fa-solid fa-circle text-[8px]"></i> {currentProduct.status}
                                                </span>
                                            </div>

                                            <h1 className="text-xl md:text-2xl font-extrabold text-navy-900 leading-snug mb-3">
                                                {currentProduct.name}
                                            </h1>

                                            <div className="text-xs text-slate-500 space-y-1 mb-4">
                                                <p>Thương hiệu: <strong className="text-slate-800">{currentProduct.brand}</strong></p>
                                                <p>Bảo hành: <strong className="text-slate-800">{currentProduct.warranty}</strong></p>
                                            </div>

                                            <p className="text-justify text-xs md:text-sm text-slate-600 leading-relaxed mb-6 border-y border-slate-100 py-3">
                                                {currentProduct.desc}
                                            </p>
                                        </div>

                                        {/* CTA Card */}
                                        <div className="bg-slate-50 p-5 rounded-xl border border-slate-200 space-y-4">
                                            <div className="flex items-baseline justify-between">
                                                <span className="text-xs text-slate-500 font-medium">Giá bán:</span>
                                                <span className="text-lg md:text-xl font-black text-brand-orange">Liên hệ</span>
                                            </div>

                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                <button 
                                                    onClick={() => handleOpenQuote(currentProduct.name)}
                                                    className="bg-brand-orange hover:bg-brand-orangeHover text-white font-bold py-3 px-4 rounded-xl text-xs md:text-sm flex items-center justify-center gap-2 shadow-md transition"
                                                >
                                                    <i className="fa-solid fa-file-signature"></i>
                                                    <span>Gửi yêu cầu báo giá</span>
                                                </button>
                                                <a 
                                                    href="tel:0932388286" 
                                                    className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl text-xs md:text-sm flex items-center justify-center gap-2 shadow-md transition"
                                                >
                                                    <i className="fa-solid fa-phone-volume"></i>
                                                    <span>0932.388.286 (Hotline)</span>
                                                </a>
                                            </div>

                                            <div className="grid grid-cols-3 gap-2 pt-2 text-[11px] text-slate-500 border-t border-slate-200/60">
                                                <div className="flex items-center gap-1.5"><i className="fa-solid fa-truck-fast text-brand-orange"></i> Giao toàn quốc</div>
                                                <div className="flex items-center gap-1.5"><i className="fa-solid fa-certificate text-brand-orange"></i> Hỗ trợ hiệu chuẩn</div>
                                                <div className="flex items-center gap-1.5"><i className="fa-solid fa-headset text-brand-orange"></i> Hỗ trợ HDSD</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* Bottom Tabs Detail */}
                                <div className="bg-white rounded-2xl border border-slate-200 smooth-shadow overflow-hidden mb-8">
                                    <div className="flex border-b border-slate-200 bg-slate-50/50">
                                        {[
                                            { id: 'features', label: 'Đặc điểm nổi bật', icon: 'fa-star' },
                                            { id: 'specs', label: 'Thông số kỹ thuật', icon: 'fa-sliders' },
                                            { id: 'accessories', label: 'Phụ kiện kèm theo', icon: 'fa-box-open' },
                                            { id: 'download', label: 'Tải về', icon: 'fa-download' },
                                        ].map(tab => (
                                            <button
                                                key={tab.id}
                                                onClick={() => setActiveTab(tab.id)}
                                                className={`flex-1 py-4 px-4 text-xs md:text-sm font-bold flex items-center justify-center gap-2 border-b-2 transition ${
                                                    activeTab === tab.id
                                                        ? 'border-brand-orange text-brand-orange bg-white'
                                                        : 'border-transparent text-slate-500 hover:text-slate-800'
                                                }`}
                                            >
                                                <i className={`fa-solid ${tab.icon}`}></i>
                                                <span>{tab.label}</span>
                                            </button>
                                        ))}
                                    </div>

                                    <div className="p-6 md:p-8">
                                        {activeTab === 'features' && (
                                            <div className="space-y-4">
                                                
                                                <ul className="space-y-3">
                                                    {currentProduct.features.map((feat, i) => (
                                                        <li key={i} className="flex items-start gap-3 text-xs md:text-sm text-slate-700">
                                                            <div className="w-5 h-5 rounded-full bg-orange-100 text-brand-orange flex items-center justify-center text-xs shrink-0 mt-0.5">
                                                                <i className="fa-solid fa-check"></i>
                                                            </div>
                                                            <span>{feat}</span>
                                                        </li>
                                                    ))}
                                                </ul>
                                            </div>
                                        )}

                                        {activeTab === 'specs' && (
                                            <div>
                                                <h3 className="text-base font-bold text-navy-900 mb-4">Bảng thông số kỹ thuật chi tiết</h3>
                                                <div className="border border-slate-200 rounded-xl overflow-hidden">
                                                    <table className="w-full text-xs md:text-sm text-left">
                                                        <tbody>
                                                            {currentProduct.detailedSpecs.map((spec, i) => (
                                                                <tr key={i} className={i % 2 === 0 ? 'bg-slate-50' : 'bg-white'}>
                                                                    <td className="py-3 px-4 font-semibold text-slate-800 w-1/3 border-r border-slate-200">{spec.name}</td>
                                                                    <td className="py-3 px-4 text-slate-600">{spec.value}</td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>
                                        )}

                                        {activeTab === 'accessories' && (
                                            <div>
                                                <h3 className="text-base font-bold text-navy-900 mb-3">Danh mục phụ kiện trong hộp</h3>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                    {currentProduct.accessories.map((acc, i) => (
                                                        <div key={i} className="p-3 bg-slate-50 border border-slate-200 rounded-lg text-xs font-medium text-slate-700 flex items-center gap-2.5">
                                                            <i className="fa-solid fa-cube text-brand-orange"></i>
                                                            <span>{acc}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                        {activeTab === 'download' && (
                                        <div>
                                            <h3 className="text-base font-bold text-navy-900 mb-3">Tài liệu kỹ thuật & Catalog</h3>
                                            <p className="text-xs text-slate-500 mb-4">Nhấn để tải về catalog chi tiết của thiết bị.</p>
                                            
                                            <a 
                                                href={currentProduct.downloadUrl || '#'} 
                                                target="_blank" 
                                                rel="noopener noreferrer"
                                                download
                                                className="p-4 bg-slate-50 hover:bg-orange-50/50 border border-slate-200 hover:border-brand-orange rounded-xl transition flex items-center justify-between group max-w-md"
                                            >
                                                <div className="flex items-center gap-3">
                                                    <div className="w-10 h-10 rounded-lg bg-red-100 text-red-600 flex items-center justify-center text-lg shrink-0">
                                                        <i className="fa-solid fa-file-pdf"></i>
                                                    </div>
                                                    <div>
                                                        <div className="text-xs md:text-sm font-bold text-slate-800 group-hover:text-brand-orange transition">
                                                            {currentProduct.name}
                                                        </div>
                                                        <div className="text-[11px] text-slate-400">Định dạng PDF</div>
                                                    </div>
                                                </div>
                                                <i className="fa-solid fa-download text-slate-400 group-hover:text-brand-orange transition ml-2"></i>
                                            </a>
                                        </div>
                                    )}
                                    </div>
                                </div>

                                {/* Back Button */}
                                <div className="text-center">
                                    <button 
                                        onClick={() => setView('home')} 
                                        className="inline-flex items-center gap-2 bg-slate-200 hover:bg-slate-300 text-slate-800 font-semibold text-xs py-2.5 px-6 rounded-lg transition"
                                    >
                                        <i className="fa-solid fa-arrow-left"></i>
                                        <span>Quay lại trang chủ & Danh sách sản phẩm</span>
                                    </button>
                                </div>
                            </div>
                        </main>
                    )}

                    {/* Modal Báo Giá */}
                    {isQuoteOpen && (
                        <div className="fixed inset-0 bg-navy-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 relative shadow-2xl">
                                <button 
                                    onClick={() => setIsQuoteOpen(false)}
                                    className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-sm"
                                >
                                    <i className="fa-solid fa-xmark"></i>
                                </button>

                                <h3 className="text-lg font-bold text-navy-900 mb-1">Yêu cầu báo giá thiết bị</h3>
                                <p className="text-xs text-slate-500 mb-4">Điền thông tin để 168 Energy gửi bảng báo giá ưu đãi trong 15 phút.</p>

                                {formSubmitted ? (
                                    <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-xl text-center space-y-2 py-8">
                                        <i className="fa-solid fa-circle-check text-emerald-500 text-3xl"></i>
                                        <p className="text-sm font-bold text-emerald-800">Gửi yêu cầu thành công!</p>
                                        <p className="text-xs text-emerald-600">Bộ phận kinh doanh sẽ liên hệ báo giá tới quý khách ngay lập tức.</p>
                                    </div>
                                ) : (
                                    <form 
    onSubmit={(e) => {
        e.preventDefault();
        // Đóng popup khi bấm Gửi:
    setIsQuoteOpen(false);

        // 1. Dữ liệu lấy từ các ô nhập liệu
        const templateParams = {
            product_name: quoteProduct,
            user_name: e.target.fullName.value,
            user_phone: e.target.phone.value,
            user_note: e.target.note.value,
        };

        // 2. Lệnh gửi mail
        emailjs.send('service_ipxra2d', 'template_9dd1j02', templateParams)
            .then(() => {
                alert('Yêu cầu đã được gửi! Chúng tôi sẽ liên hệ lại ngay.');
                setIsQuoteModalOpen(false);
            })
            .catch((err) => {
                alert('Gửi thất bại, vui lòng liên hệ trực tiếp Hotline!');
                console.error('Lỗi gửi mail:', err);
            });
    }} 
    className="space-y-3"
>
    <div>
    <label className="block text-xs font-semibold text-slate-700 mb-1">Sản phẩm quan tâm</label>
    <input 
        type="text" 
        value={quoteProduct} 
        onChange={(e) => setQuoteProduct(e.target.value)}
        className="w-full bg-white border border-slate-200 rounded-lg p-2 text-xs font-medium text-slate-700" 
    />
    </div>
    <div>
        <label className="block text-xs font-semibold text-slate-700 mb-1">Họ và tên *</label>
        {/* Thêm attribute name="fullName" */}
        <input type="text" name="fullName" required placeholder="Nguyễn Văn A" className="w-full border border-slate-200 rounded-lg p-2 text-xs focus:border-brand-orange focus:outline-none" />
    </div>
    <div>
        <label className="block text-xs font-semibold text-slate-700 mb-1">Số điện thoại *</label>
        {/* Thêm attribute name="phone" */}
        <input type="tel" name="phone" required placeholder="0901234567" className="w-full border border-slate-200 rounded-lg p-2 text-xs focus:border-brand-orange focus:outline-none" />
    </div>
    <div>
        <label className="block text-xs font-semibold text-slate-700 mb-1">Ghi chú thêm</label>
        {/* Thêm attribute name="note" */}
        <textarea name="note" rows="2" placeholder="Số lượng, địa điểm giao hàng..." className="w-full border border-slate-200 rounded-lg p-2 text-xs focus:border-brand-orange focus:outline-none"></textarea>
    </div>
    <button type="submit" className="w-full bg-brand-orange hover:bg-brand-orangeHover text-white py-2.5 rounded-lg text-xs font-bold transition-colors">
        Gửi yêu cầu báo giá
    </button>
</form>
                                )}
                            </div>
                        </div>
                    )}
{/* Modal Chính Sách (Popup) */}
                    {activePolicy && POLICIES_DATA[activePolicy] && (
                        <div className="fixed inset-0 bg-navy-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-2xl w-full p-6 md:p-8 relative shadow-2xl max-h-[90vh] overflow-y-auto">
                                <button 
                                    onClick={() => setActivePolicy(null)}
                                    className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-sm w-8 h-8 flex items-center justify-center bg-slate-100 hover:bg-slate-200 rounded-full transition"
                                >
                                    <i className="fa-solid fa-xmark"></i>
                                </button>

                                <h3 className="text-xl font-black text-navy-900 mb-4 pb-3 border-b border-slate-100 pr-8">
                                    {POLICIES_DATA[activePolicy].title}
                                </h3>
                                
                                <div className="mt-2">
                                    {POLICIES_DATA[activePolicy].content}
                                </div>
                                
                                <div className="mt-8 pt-5 border-t border-slate-100 flex justify-end">
                                    <button 
                                        onClick={() => setActivePolicy(null)}
                                        className="bg-brand-orange hover:bg-brand-orangeHover text-white font-bold text-xs py-2.5 px-6 rounded-lg transition"
                                    >
                                        Đã hiểu & Đóng
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                    {/* Footer */}
                    <footer className="bg-navy-950 text-slate-400 text-xs py-10 border-t border-slate-800">
                        <div className="max-w-7xl mx-auto px-4 md:px-8 grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
                            {/* Cột 1: Thông tin công ty */}
                            <div className="space-y-3">
                                <div className="font-extrabold text-base text-white tracking-tight">168 <span className="text-brand-orange">ENERGY</span></div>
                                <p className="text-slate-400 text-xs leading-relaxed">
                                    CÔNG TY CỔ PHẦN NĂNG LƯỢNG NHẤT LỘC PHÁT - Đơn vị hàng đầu phân phối máy đo thí nghiệm điện và dịch vụ kỹ thuật an toàn điện tại Việt Nam.
                                </p>
                            </div>
                            
                            {/* Cột 2: Thông tin liên hệ */}
                            <div>
                                <p className="font-bold text-white mb-3 text-sm">Thông tin liên hệ</p>
                                <p className="mb-1.5 flex items-start gap-2"><i className="fa-solid fa-location-dot text-brand-orange mt-0.5"></i><span>Số 7 ngõ 8, phố Bế Văn Đàn, Phường Hà Đông, Thành phố Hà Nội, Việt Nam</span></p>
                                <p className="mb-1.5 flex items-center gap-2"><i className="fa-solid fa-phone text-brand-orange"></i><span>Hotline: 0932.388.286</span></p>
                                <p className="flex items-center gap-2"><i className="fa-solid fa-envelope text-brand-orange"></i><span>168energy.jsc@gmail.com</span></p>
                            </div>
                            
                            {/* Cột 3: Chính sách & Hỗ trợ (Đã sửa) */}
                            <div>
                                <p className="font-bold text-white mb-3 text-sm">Chính sách & Hỗ trợ</p>
                                <ul className="space-y-2 text-slate-400">
                                    <li><button onClick={() => setActivePolicy('warranty')} className="hover:text-brand-orange transition inline-flex items-center gap-1.5 text-left"><i className="fa-solid fa-angle-right text-[10px]"></i> Chính sách bảo hành & Đổi trả</button></li>
                                    <li><button onClick={() => setActivePolicy('shipping')} className="hover:text-brand-orange transition inline-flex items-center gap-1.5 text-left"><i className="fa-solid fa-angle-right text-[10px]"></i> Chính sách giao hàng</button></li>
                                    <li><button onClick={() => setActivePolicy('privacy')} className="hover:text-brand-orange transition inline-flex items-center gap-1.5 text-left"><i className="fa-solid fa-angle-right text-[10px]"></i> Chính sách bảo mật thông tin</button></li>
                                    <li><button onClick={() => setActivePolicy('payment')} className="hover:text-brand-orange transition inline-flex items-center gap-1.5 text-left"><i className="fa-solid fa-angle-right text-[10px]"></i> Hướng dẫn mua hàng & Thanh toán</button></li>
                                    <li><button onClick={() => setActivePolicy('support')} className="hover:text-brand-orange transition inline-flex items-center gap-1.5 text-left"><i className="fa-solid fa-angle-right text-[10px]"></i> Hỗ trợ kỹ thuật & Tải tài liệu</button></li>
                                </ul>
                            </div>
                        </div>
                        <div className="max-w-7xl mx-auto px-4 md:px-8 border-t border-slate-800/80 pt-6 text-center text-slate-500">
                            <p>© 2026 168 Energy - Công Ty Cổ Phần Năng Lượng Nhất Lộc Phát. All rights reserved.</p>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
